# Release notes for a Flux-managed cluster.
#
# Cluster access (pick one):
#   * GitLab agent for Kubernetes: set KUBE_CONTEXT to "<agent-project-path>:<agent-name>"
#     and authorise this project in the agent's config (ci_access.projects or .groups).
#   * A kubeconfig: add a CI/CD variable named KUBECONFIG of type "File".
#   The identity used only needs read access (see README for a minimal ClusterRole).
#
# Registry access (optional, for images no pod reports a digest for, such as
# idle CronJobs or deployments scaled to zero): add a CI/CD variable named
# REGISTRY_AUTH_FILE of type "File" containing a Docker config.json. Public
# images resolve without it.
#
# What each pipeline does:
#   * Tag pipeline (e.g. v2026.10.2): notes diffed against the last release, a
#     GitLab Release is created from the summary, and the baseline snapshot is updated.
#     INVENTORY.md (what is deployed, no comparison) and RELEASE_NOTES_DETAILED.md
#     are kept as job artifacts.
#   * Scheduled or manual ("Run pipeline") pipeline: preview notes against the
#     last release, published as job artifacts. The baseline is left alone, unless
#     you set UPDATE_BASELINE=true for that run.
#
# Snapshots live in this project's generic package registry:
#   flux-release-notes/baseline/snapshot.json  the latest release (the diff base)
#   flux-release-notes/<release>/snapshot.json one copy per release, for history

variables:
  KUBECTL_VERSION: "v1.31.2"
  KUBE_CONTEXT: ""            # GitLab agent context; leave empty when using KUBECONFIG
  UPDATE_BASELINE: "false"
  RESOLVE_DIGESTS: "skopeo"   # "off" to skip registry lookups
  FORGES: ""                  # self-hosted Git hosts for links, e.g. "git.acme.internal=gitlab"
  EXTRA_ARGS: ""              # e.g. "--include-unmanaged --exclude-namespace monitoring"
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/flux-release-notes"

stages:
  - notes
  - release

release-notes:
  stage: notes
  image: python:3.12-alpine
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache curl
    - if [ "$RESOLVE_DIGESTS" != "off" ]; then apk add --no-cache skopeo; fi
    - |
      case "$(uname -m)" in
        x86_64) ARCH=amd64 ;;
        aarch64|arm64) ARCH=arm64 ;;
        *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
      esac
      curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
      chmod +x /usr/local/bin/kubectl
  script:
    - |
      set -eu
      fetch() {  # fetch <release> <file>: download a stored snapshot, 0 if found
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "$2" "$PACKAGE_URL/$1/snapshot.json" 2>/dev/null
      }
      field() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2], ""))' "$1" "$2"; }

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        RELEASE="$CI_COMMIT_TAG"
      elif [ "$UPDATE_BASELINE" = "true" ]; then
        RELEASE="manual-$CI_PIPELINE_ID"
      else
        RELEASE=""
      fi

      ARGS="$EXTRA_ARGS --resolve-digests $RESOLVE_DIGESTS"
      if [ -n "$KUBE_CONTEXT" ]; then ARGS="$ARGS --context $KUBE_CONTEXT"; fi
      for f in $FORGES; do ARGS="$ARGS --forge $f"; done

      if fetch baseline previous.json; then
        # A retried tag pipeline finds its own snapshot as the baseline: use the one before it.
        if [ -n "$RELEASE" ] && [ "$(field previous.json release)" = "$RELEASE" ]; then
          BEFORE="$(field previous.json previous_release)"
          rm -f previous.json
          if [ -n "$BEFORE" ] && fetch "$BEFORE" previous.json; then :; else rm -f previous.json; fi
        fi
      fi
      if [ -f previous.json ]; then
        echo "Comparing with release: $(field previous.json release)"
        ARGS="$ARGS --previous previous.json"
      else
        echo "No baseline snapshot yet - generating the full inventory without a diff."
      fi

      if [ -n "$RELEASE" ]; then
        TITLE="Release $RELEASE"
      else
        TITLE="Release preview $(date -u +%Y-%m-%d)"
      fi

      python3 flux_release_notes.py $ARGS --release "$RELEASE" --title "$TITLE" \
        --snapshot-out snapshot.json --images-out images.txt \
        --out RELEASE_NOTES.md --inventory-out INVENTORY.md --detailed-out RELEASE_NOTES_DETAILED.md

      if [ -n "$RELEASE" ]; then
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file snapshot.json "$PACKAGE_URL/$RELEASE/snapshot.json"
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file snapshot.json "$PACKAGE_URL/baseline/snapshot.json"
        echo "Baseline snapshot updated to $RELEASE."
      fi
  artifacts:
    name: "release-notes-${CI_COMMIT_REF_SLUG}"
    paths:
      - RELEASE_NOTES.md
      - INVENTORY.md
      - RELEASE_NOTES_DETAILED.md
      - snapshot.json
      - images.txt
    expire_in: 90 days

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: release-notes
      artifacts: true
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: ./RELEASE_NOTES.md
